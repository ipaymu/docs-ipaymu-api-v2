# Shell runners with Docker access, following my-hallobali.
# Override BUILD_RUNNER_TAG to move builds off the deployment VPS.
stages: [build, deploy]

variables:
  BUILD_RUNNER_TAG: hostinger-runner
  DEPLOY_RUNNER_TAG: hostinger-runner
  DOCKER_BUILDKIT: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: "$CI_COMMIT_TAG =~ /^v/"
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build_image:
  stage: build
  tags: [$BUILD_RUNNER_TAG]
  script:
    - bash deploy/gitlab-build.sh
  artifacts:
    paths:
      - docker-compose.prod.yml
      - deploy/
      - scripts/smoke-mcp.mjs
    expire_in: 14 days

.deploy_base:
  stage: deploy
  tags: [$DEPLOY_RUNNER_TAG]
  needs:
    - job: build_image
      artifacts: true
  script:
    - bash deploy/gitlab-deploy.sh

deploy_staging:
  extends: .deploy_base
  resource_group: ipaymu-docs-staging
  environment:
    name: staging
    url: https://$STAGING_DOMAIN
  variables:
    ENV_NAME: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "staging"'

deploy_production:
  extends: .deploy_base
  resource_group: ipaymu-docs-production
  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
  variables:
    ENV_NAME: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: "$CI_COMMIT_TAG =~ /^v/"
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
