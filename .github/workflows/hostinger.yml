# Membangun situs dan mengemas HANYA folder `out/` sebagai artifact.
# Unduh ZIP artifact dari tab Actions, lalu upload isinya ke public_html Hostinger.
#
# Kenapa terpisah dari pages.yml: workflow Pages membangun dengan BASE_PATH
# (subpath GitHub Pages). Kalau hasil build itu diupload ke domain root
# Hostinger, semua aset 404. Workflow ini sengaja TIDAK menyetel BASE_PATH.
#
# ZIP ini tidak memuat package.json / bun.lock, jadi pemindai dependensi
# Hostinger tidak punya manifest untuk dibaca.

name: Bundel Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Mermaid (remark-mermaid-dataurl) merender diagram lewat Chromium headless.
      PUPPETEER_CHROMIUM_FLAGS: "--no-sandbox"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pastikan .htaccess ikut terbawa
        run: test -f out/.htaccess || { echo "::error::out/.htaccess hilang - rute /id/docs akan 404 di Apache"; exit 1; }

      - name: Upload bundel statis
        uses: actions/upload-artifact@v4
        with:
          name: situs-hostinger
          path: out/
          # WAJIB: tanpa ini .htaccess (file tersembunyi) dibuang diam-diam.
          include-hidden-files: true
          retention-days: 30
